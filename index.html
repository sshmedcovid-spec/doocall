<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOOCALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1B3F;--ink2:#2A3B63;--muted:#56658A;
  --blue:#2563EB;--blue-d:#1D4ED8;--cyan:#0EA5E9;--aqua:#14B8D4;
  --grad:linear-gradient(135deg,#2563EB 0%,#0EA5E9 100%);
  --blue-l:#E3EFFF;--line:#D6DEF5;--input:#C9D4F0;
  --glass:rgba(255,255,255,.74);--glass-b:rgba(255,255,255,.95);
  --red:#E5484D;--red-d:#B4232A;--red-t:#C42B30;--red-l:#FFECEC;
  --amber:#A65A06;--amber-l:#FFF1DB;--amber-c:#F59E0B;
  --green:#11804A;--green-l:#DFF7EA;--green-c:#22C55E;
  --gray:#55657F;--gray-l:#EDF1F8;
  --shadow:0 12px 32px rgba(36,58,140,.10),inset 0 1px 0 rgba(255,255,255,.9);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Anuphan','Noto Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);min-height:100vh;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 700px at 0% 0%,#BCD3FF 0%,rgba(188,211,255,0) 60%),
    radial-gradient(900px 700px at 100% 0%,#CBE6FF 0%,rgba(203,230,255,0) 55%),
    radial-gradient(900px 700px at 85% 100%,#C2F0F7 0%,rgba(194,240,247,0) 60%),
    radial-gradient(800px 600px at 5% 100%,#DDE6FF 0%,rgba(221,230,255,0) 60%),
    #F2F5FF;
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit}
a{color:var(--blue-d)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.display,.h1,.h2,.brand-t,.kpi .v,.big-name{font-family:'Prompt','Anuphan',sans-serif}
.muted{color:var(--muted)}
.ink2{color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1440px;margin:0 auto;padding-left:32px;padding-right:32px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:10px}
.row-w{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:var(--shadow)}
.h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
.h2{margin:0;font-size:20px;font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.sub2{margin:4px 0 0;font-size:15px;color:var(--muted)}
.ic{display:inline-flex;flex:none}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.62);border-bottom:1px solid rgba(255,255,255,.9);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:0 4px 20px rgba(36,58,140,.06)}
.topbar.dept{background:linear-gradient(120deg,rgba(37,99,235,.92),rgba(14,165,233,.9));color:#fff;border-bottom:none}
.topbar-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 8px 18px rgba(37,99,235,.35)}
.topbar.dept .logo{background:rgba(255,255,255,.2);box-shadow:none}
.brand-t{font-weight:700;font-size:20px;line-height:1.15;letter-spacing:.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar.dept .brand-t{background:none;color:#fff;font-size:22px;letter-spacing:0}
.brand-s{font-size:13px;color:var(--muted)}
.topbar.dept .brand-s,.topbar.dept .sub{color:rgba(255,255,255,.85)}
.nav{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9)}
.nav button{min-height:40px;padding:0 16px;border-radius:10px;border:none;background:transparent;color:var(--ink2);font-weight:500;cursor:pointer}
.nav button.on{background:var(--grad);color:#fff;font-weight:600;box-shadow:0 6px 14px rgba(37,99,235,.3)}
.clock{font-family:'Prompt',sans-serif;font-weight:600;font-size:17px}
.status{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:10px;height:10px;border-radius:99px;display:inline-block;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.userchip{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;font-size:14px;font-weight:600;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95)}
.topbar.dept .userchip{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3)}
.avatar{width:34px;height:34px;border-radius:99px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(37,99,235,.35)}
.topbar.dept .avatar{background:rgba(255,255,255,.25);box-shadow:none}
.linkbtn{background:none;border:none;color:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 4px}
.topbar .linkbtn{color:var(--ink2)}
.topbar.dept .linkbtn{color:rgba(255,255,255,.9)}

/* layout */
.main{padding-top:24px;padding-bottom:48px;display:flex;flex-direction:column;gap:24px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpis.kpis5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis5 .kpi{padding:16px;gap:12px}
.kpis5 .kpi-ic{width:42px;height:42px;border-radius:12px}
.kpis5 .kpi .v{font-size:28px}
.kpi{border-radius:20px;padding:18px 20px;display:flex;gap:14px;align-items:center}
.kpi-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.kpi .l{font-size:14px;font-weight:500;color:var(--ink2)}
.kpi .v{font-size:32px;font-weight:700;line-height:1.15}
.kpi .s{font-size:13px;color:var(--muted)}
.t-red .kpi-ic{background:linear-gradient(135deg,#FF7A7E,#E5484D);box-shadow:0 8px 16px rgba(229,72,77,.3)}
.t-red .v{color:var(--red-t)}
.t-amber .kpi-ic{background:linear-gradient(135deg,#FFC24D,#F59E0B);box-shadow:0 8px 16px rgba(245,158,11,.3)}
.t-amber .v{color:var(--amber)}
.t-green .kpi-ic{background:linear-gradient(135deg,#4ADE80,#16A34A);box-shadow:0 8px 16px rgba(22,163,74,.28)}
.t-green .v{color:var(--green)}
.t-blue .kpi-ic{background:var(--grad);box-shadow:0 8px 16px rgba(37,99,235,.3)}
.t-blue .v{color:var(--blue-d)}
.t-gray .kpi-ic{background:linear-gradient(135deg,#A9B6CF,#7B8AA8)}
.kpi.alert{background:linear-gradient(135deg,#F0565B,#B4232A);border-color:transparent;color:#fff;animation:escPulse 1.6s ease-in-out infinite}
.kpi.alert .kpi-ic{background:rgba(255,255,255,.22);box-shadow:none}
.kpi.alert .l,.kpi.alert .s,.kpi.alert .v{color:#fff}
.layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}
.card{border-radius:22px;padding:24px}
.form-card{position:sticky;top:92px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:14px;font-weight:600;color:var(--ink)}
.input{height:48px;padding:0 14px;border:1px solid var(--input);border-radius:12px;font-size:16px;color:var(--ink);background:rgba(255,255,255,.95);width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,108,246,.18)}
textarea.input{height:auto;padding:10px 14px;resize:vertical}
.input.sm{height:44px;font-size:15px;width:auto}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:13px;color:var(--blue-d);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--ink2);font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--ink2);font-weight:600;cursor:pointer}
.seg button.on-n{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button.on-u{background:var(--red);border-color:var(--red);color:#fff}
.btn{min-height:48px;padding:0 20px;border-radius:14px;border:none;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .1s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:wait}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 20px rgba(37,99,235,.3)}
.btn-red{background:linear-gradient(135deg,#F0565B,#C42B30);color:#fff;box-shadow:0 10px 20px rgba(229,72,77,.3)}
.btn-green{background:linear-gradient(135deg,#22C55E,#12804A);color:#fff;box-shadow:0 8px 16px rgba(22,163,74,.25)}
.btn-light{background:rgba(255,255,255,.95);color:var(--ink);border:1px solid var(--line)}
.btn-big{min-height:54px;font-size:17px}
.btn-xl{min-height:60px;font-size:20px;font-weight:700}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px}
.msg{border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;word-break:break-word}
.msg.error{background:var(--red-l);color:var(--red-t)}
.msg.ok{background:var(--green-l);color:var(--green)}
.msg.info{background:var(--blue-l);color:var(--blue-d)}

/* board */
.board-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.filter{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);font-weight:500}
.filter .input{width:auto;height:44px;font-size:15px}
.tabs{display:inline-flex;gap:4px;flex-wrap:wrap;padding:5px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.95);align-self:flex-start}
.tab{min-height:42px;padding:4px 6px 4px 14px;border-radius:12px;border:none;background:transparent;color:var(--ink2);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab .n{min-width:26px;padding:1px 8px;border-radius:99px;background:var(--gray-l);font-size:13px;font-weight:600;text-align:center}
.tab.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(37,99,235,.3)}
.tab.on .n{background:rgba(255,255,255,.25);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}

/* case card */
.case{border-radius:20px;padding:0;display:flex;flex-direction:column;overflow:hidden}
.case-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px 12px}
.dname{font-family:'Prompt',sans-serif;font-weight:600;font-size:16px;line-height:1.25}
.ext{display:flex;align-items:center;flex-wrap:wrap;column-gap:6px;row-gap:0;font-size:13px;color:var(--muted);margin-top:2px}
.ext>span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.case-b{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
.patient{background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.95);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 8px rgba(36,58,140,.05)}
.pname{font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pphone{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:var(--blue-d);letter-spacing:.02em}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag-topic{padding:2px 10px;border-radius:8px;background:var(--blue-l);color:var(--blue-d);font-size:13px;font-weight:500}
.tag-warn{padding:2px 10px;border-radius:8px;background:var(--amber-l);color:var(--amber);font-size:13px;font-weight:600}
.pnote{font-size:14px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:6px}
.urgent{padding:1px 8px;border-radius:6px;background:var(--red);color:#fff;font-size:12px;font-weight:700;font-family:'Anuphan',sans-serif}
.pill{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:7px;height:7px;border-radius:99px;background:currentColor}
.pill.lg{font-size:14px;font-weight:700;padding:5px 12px}
.st-pending{background:var(--red-l);color:var(--red-t)}
.st-ack{background:var(--amber-l);color:var(--amber)}
.st-done{background:var(--green-l);color:var(--green)}
.st-fail,.st-wrong,.st-cancelled{background:var(--gray-l);color:var(--gray)}
.case.s-pending{background:linear-gradient(180deg,rgba(255,236,236,.9) 0%,rgba(255,255,255,.74) 42%)}
.case.s-ack{background:linear-gradient(180deg,rgba(255,241,219,.9) 0%,rgba(255,255,255,.74) 42%)}
.case.s-done{background:linear-gradient(180deg,rgba(223,247,234,.9) 0%,rgba(255,255,255,.74) 42%)}
.case.s-fail,.case.s-wrong,.case.s-cancelled{background:linear-gradient(180deg,rgba(237,241,248,.95) 0%,rgba(255,255,255,.74) 42%)}

/* mini timeline */
.tl{display:flex;align-items:flex-start;gap:0;margin:0;padding:0;list-style:none}
.tl li{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;position:relative;padding-top:16px;font-size:12px;color:var(--muted)}
.tl li::before{content:"";position:absolute;top:5px;left:12px;right:0;height:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.on::before{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.tl .d{position:absolute;top:0;left:0;width:12px;height:12px;border-radius:99px;background:#fff;border:2px solid var(--line)}
.tl li.on .d{background:var(--grad);border-color:transparent;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.tl li.now .d{border-color:var(--red);background:#fff;animation:blink 1.2s ease-in-out infinite}
.tl li.now-a .d{border-color:var(--amber-c);background:#fff}
.tl b{font-size:12px;font-weight:600;color:var(--ink2)}
.tl .t{font-size:14px;font-weight:600;color:var(--ink)}
.tl .t.red{color:var(--red-t)}
.tl em{font-style:normal;font-size:12px;color:var(--muted)}
.case.clickable{cursor:pointer;transition:box-shadow .15s}
.case.clickable:hover{box-shadow:0 16px 36px rgba(36,58,140,.16),inset 0 1px 0 rgba(255,255,255,.9)}
.corner{display:flex;align-items:center;gap:6px;flex:none}
.trash{width:36px;height:36px;border-radius:12px;border:1px solid rgba(229,72,77,.25);background:rgba(255,236,236,.85);color:var(--red-t);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .1s}
.trash:hover{background:var(--red);color:#fff;border-color:var(--red)}
.trash:active{transform:scale(.94)}
.trash.on-red{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff}
.trash.on-red:hover{background:#fff;color:var(--red-d)}
.case.clickable:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn-glass{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.95);color:var(--ink2);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);box-shadow:0 6px 16px rgba(36,58,140,.08),inset 0 1px 0 rgba(255,255,255,.9);font-weight:600;min-height:46px;font-size:15px}
.btn-glass:hover{background:rgba(255,236,236,.8);border-color:rgba(229,72,77,.35);color:var(--red-t)}
.case-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;border-top:1px solid rgba(214,222,245,.7);font-size:12px;color:var(--muted);min-height:44px}
.xbtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;min-height:36px;padding:0 6px;border-radius:8px;display:inline-flex;align-items:center;gap:4px}
.xbtn:hover{background:rgba(229,72,77,.08);color:var(--red-t)}

/* escalated */
.esc-head{color:var(--red-d);font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.case.esc{background:linear-gradient(150deg,#F0565B 0%,#B4232A 100%);border-color:transparent;color:#fff;animation:escPulse 1.6s ease-in-out infinite}
.case.esc .ext,.case.esc .case-f,.case.esc .xbtn{color:rgba(255,255,255,.88)}
.case.esc .case-f{border-top-color:rgba(255,255,255,.2)}
.case.esc .xbtn:hover{background:rgba(255,255,255,.14);color:#fff}
.case.esc .patient{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);box-shadow:none}
.case.esc .pphone{color:#fff}
.case.esc .tag-topic{background:rgba(255,255,255,.2);color:#fff}
.esc-call{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;color:var(--red-d);border-radius:14px;padding:10px 14px}
.esc-call .ext-big{font-family:'Prompt',sans-serif;font-size:24px;font-weight:700;line-height:1.2}
.esc-call .lbl2{font-size:12px;font-weight:600;color:var(--red-t)}
.esc-wait{padding:4px 10px;border-radius:999px;background:#fff;color:var(--red-d);font-size:13px;font-weight:700;white-space:nowrap}
.empty{border:2px dashed var(--line);border-radius:20px;padding:48px 24px;text-align:center;color:var(--muted);font-size:15px;background:rgba(255,255,255,.4)}

/* department */
.alarm{color:#fff;animation:alarm 1s ease-in-out infinite}
.alarm-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:18px;padding-bottom:18px}
.alarm-t{font-family:'Prompt',sans-serif;font-size:22px;font-weight:600}
.alarm-s{font-size:15px;color:#FFE1E1}
.ring{animation:ring 1s ease-in-out infinite;transform-origin:50% 10%}
.dstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start}
.dcase{border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.dcase.s-pending{background:linear-gradient(180deg,rgba(255,226,226,.95) 0%,rgba(255,255,255,.8) 55%);border:2px solid var(--red);animation:glow 1.4s ease-in-out infinite}
.dcase.s-ack{background:linear-gradient(180deg,rgba(255,241,219,.9) 0%,rgba(255,255,255,.74) 45%)}
.big-name{font-size:21px;font-weight:600;line-height:1.3}
.wait{font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.wait.late{color:var(--red-t)}
.tel{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.9);border:1px solid var(--line);color:var(--blue-d);text-decoration:none}
.tel span{font-family:'Prompt',sans-serif;font-size:22px;font-weight:600;letter-spacing:.02em}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.closed-box{border-radius:18px;overflow:hidden}
.closed-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--gray-l);flex-wrap:wrap}
.closed-row:last-child{border-bottom:none}

/* dialog / toast */
.overlay{position:fixed;inset:0;background:rgba(11,27,63,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{width:100%;max-width:420px;border-radius:24px;padding:28px;background:rgba(255,255,255,.96);border:1px solid var(--glass-b);box-shadow:0 24px 60px rgba(11,27,63,.25);display:flex;flex-direction:column;gap:16px}
.emp{height:58px;font-size:26px;letter-spacing:3px;font-family:'Prompt',sans-serif;text-align:center}
.dlg-btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(11,27,63,.2);font-weight:500}
.sys{padding-top:12px}

/* stats */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.segbox{display:flex;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);border-radius:14px;padding:4px;gap:4px}
.segbox button{min-height:40px;padding:0 16px;border:none;border-radius:10px;background:transparent;color:var(--ink2);font-size:14px;font-weight:600;cursor:pointer}
.segbox button.on{background:var(--grad);color:#fff}
.range-form{display:flex;align-items:center;gap:6px}
.st-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.trow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.4fr) 44px 86px 86px 76px 56px;gap:12px;align-items:center;font-size:14px;padding:3px 0}
.trow.head{font-size:13px;color:var(--muted);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--gray-l)}
.trow .r{text-align:right}
.trow .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;background:var(--gray-l);border-radius:99px;overflow:hidden}
.bar>div{height:12px;border-radius:99px}
.hours{display:flex;align-items:flex-end;gap:4px;height:170px}
.hcol{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;min-width:0}
.hbar{width:100%;border-radius:5px 5px 2px 2px;background:#BFDBFE}
.hbar.hi{background:var(--grad)}
.hn,.hl{font-size:10px;color:var(--muted)}
.hlabels{display:flex;gap:4px}
.hlabels .hl{flex:1 1 0;text-align:center;min-width:0}
.stackbar{display:flex;height:20px;border-radius:999px;overflow:hidden;gap:2px;background:var(--gray-l)}
.legend{display:flex;align-items:center;gap:10px;font-size:15px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}

/* admin */
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.admin-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--gray-l);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:13px}
.tag{padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.tag.on{background:var(--green-l);color:var(--green)}
.tag.off{background:var(--gray-l);color:var(--gray)}

/* login */
.login{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:100vh}
.login-brand{position:relative;overflow:hidden;background:linear-gradient(150deg,#1D4ED8 0%,#2563EB 40%,#0EA5E9 100%);color:#fff;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.orb.o1{width:460px;height:460px;right:-150px;top:-140px}
.orb.o2{width:260px;height:260px;left:-90px;bottom:-80px;background:rgba(56,189,248,.22)}
.orb.o3{width:120px;height:120px;right:18%;bottom:16%;background:rgba(255,255,255,.18)}
.login-brand>*:not(.orb){position:relative;z-index:1}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}
.hero-ic{width:88px;height:88px;border-radius:28px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(10,40,120,.25),inset 0 1px 0 rgba(255,255,255,.5)}
.wordmark{font-family:'Prompt',sans-serif;font-weight:700;font-size:clamp(64px,8.5vw,128px);line-height:.95;letter-spacing:.03em;text-shadow:0 10px 40px rgba(10,40,120,.35)}
.wordmark .call{color:#BAE6FD}
.tagline{margin:0;font-size:22px;line-height:1.55;font-weight:500;color:rgba(255,255,255,.92);max-width:520px}
.login-foot{font-size:14px;color:rgba(255,255,255,.8)}
.login-side{display:flex;align-items:center;justify-content:center;padding:48px 24px}
.login-card{width:100%;max-width:400px;border-radius:26px;padding:36px;display:flex;flex-direction:column;gap:18px}
.login-mini{display:none;align-items:center;gap:10px}
.login-mini .brand-t{font-size:26px}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

@keyframes escPulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}50%{box-shadow:0 0 0 9px rgba(229,72,77,0)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.45)}50%{box-shadow:0 0 0 10px rgba(229,72,77,0)}}
@keyframes alarm{0%,100%{background:#E5484D}50%{background:#B4232A}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}50%{box-shadow:0 0 0 5px rgba(229,72,77,0)}}

@media (max-width:1200px){.kpis.kpis5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1000px){.layout,.st-grid{grid-template-columns:1fr}.kpis,.kpis.kpis5{grid-template-columns:repeat(2,minmax(0,1fr))}.form-card{position:static}}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-brand{display:none}.login-mini{display:flex}}
@media (max-width:720px){.dstats,.dcards{grid-template-columns:1fr}.wrap{padding-left:16px;padding-right:16px}.kpis,.kpis.kpis5{grid-template-columns:1fr}}
@media (max-width:640px){.trow{grid-template-columns:minmax(0,1fr) 60px}.hide-sm{display:none}}
/* น้องกริ๊งกริ๊ง */
.doo{overflow:visible;flex:none}
.doo *{transform-box:view-box}
.doo .bodyg{animation:dooBob 2.4s ease-in-out infinite;transform-origin:100px 186px}
.doo-happy .wave{animation:dooWave .9s ease-in-out infinite;transform-origin:156px 116px}
.doo-happy .spark{animation:dooTwinkle 1.4s ease-in-out infinite;transform-origin:186px 52px}
.doo-worried .drip,.doo-sad .drip{animation:dooDrip 1.8s ease-in infinite}
.doo-cry .bodyg{animation:dooShake .5s ease-in-out infinite}
.doo-cry .tears{animation:dooTears 1s ease-in-out infinite}
.doo-thanks .bodyg{animation:dooJump .55s ease-in-out infinite alternate}
.doo-thanks .hearts{animation:dooFloat 1.6s ease-in-out infinite}
.doo-sleep .bodyg{animation:dooBreath 3.2s ease-in-out infinite}
.doo-sleep .zz{animation:dooFloat 2.4s ease-in-out infinite}
.doo-bubble{width:92px;height:92px;border-radius:28px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(80,0,0,.25);flex:none}
.calm{background:rgba(255,255,255,.55);border-bottom:1px solid rgba(255,255,255,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.calm-b{box-shadow:0 8px 20px rgba(36,58,140,.12)}
.doo-pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;background:rgba(255,255,255,.95);border:1px solid #fff;border-radius:28px;padding:22px 30px 24px;box-shadow:0 30px 70px rgba(11,27,63,.28);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:dooPop 5s ease both}
.doo-pop-t{font-family:'Prompt',sans-serif;font-size:22px;font-weight:600;color:var(--blue-d)}
.doo-pop-s{font-size:14px;color:var(--muted)}
@keyframes dooBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dooWave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes dooTwinkle{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.15);opacity:1}}
@keyframes dooDrip{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes dooShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes dooTears{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes dooJump{from{transform:translateY(0)}to{transform:translateY(-16px)}}
@keyframes dooFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes dooBreath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.97)}}
@keyframes dooPop{0%{opacity:0;transform:translate(-50%,-40%) scale(.8)}6%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}10%{transform:translate(-50%,-50%) scale(1)}92%{opacity:1}100%{opacity:0;transform:translate(-50%,-55%) scale(.96)}}
@media (prefers-reduced-motion:reduce){.kpi.alert,.case.esc,.dcase.s-pending,.ring,.alarm,.tl li.now .d,.doo *,.doo-pop{animation:none!important}}

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayOffset = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return dayKey(d); };
const hm = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hms = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const dur = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
// เวลารอแบบอ่านง่าย: 4:12 นาที / 1 ชม. 26 นาที / 3 วัน 15 ชม.
const longDur = (ms, unit = 'นาที') => {
  const m = Math.floor(Math.max(0, ms) / 60000);
  if (m < 60) return `${dur(ms)} ${unit}`;
  if (m < 1440) return `${Math.floor(m / 60)} ชม. ${m % 60} ${unit}`;
  return `${Math.floor(m / 1440)} วัน ${Math.floor((m % 1440) / 60)} ชม.`;
};
const shortDur = (ms) => longDur(ms, 'น.');
const ago = (ms) => {
  const m = Math.floor(ms / 60000);
  if (m < 1) return 'เมื่อสักครู่';
  if (m < 60) return `${m} นาทีที่แล้ว`;
  return `${Math.floor(m / 60)} ชม. ${m % 60} นาทีที่แล้ว`;
};
const tms = (t) => (t ? (typeof t.toMillis === 'function' ? t.toMillis() : +t) : null);
const fmtPhone = (p) => {
  const s = String(p || '');
  const d = s.replace(/\D/g, '');
  if (d.length === 10 && d[0] === '0') return `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`;
  if (d.length === 9 && d[0] === '0') return `${d.slice(0, 2)}-${d.slice(2, 5)}-${d.slice(5)}`;
  return s;
};
const shortName = (n) => String(n || '-').replace(/^Operator\s*/i, 'OP ');
const toEmail = (u) => (u.includes('@') ? u.trim() : `${u.trim().toLowerCase()}@${USER_DOMAIN}`);
const msgHtml = (type, text) => `<div class="msg ${type}" role="${type === 'error' ? 'alert' : 'status'}">${text}</div>`;
const linkify = (s) => esc(s).replace(/(https:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

function thaiErr(err) {
  const code = err && err.code ? String(err.code) : '';
  if (['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-email'].includes(code)) return 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
  if (code === 'auth/too-many-requests') return 'ลองผิดหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่';
  if (code === 'auth/email-already-in-use') return 'ชื่อผู้ใช้นี้มีอยู่แล้ว';
  if (code === 'auth/weak-password') return 'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร';
  if (code === 'auth/network-request-failed' || code === 'unavailable') return 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต';
  if (code === 'permission-denied') return 'ไม่มีสิทธิ์ทำรายการนี้ (ตรวจสอบบทบาทของบัญชี หรือ Security Rules)';
  if (code === 'failed-precondition' && /index/i.test(err.message || '')) return 'ฐานข้อมูลต้องสร้าง Index ก่อน: ' + linkify(err.message);
  return esc(err && err.message ? err.message : String(err));
}

/* ---------- audio ---------- */
function initAudio() {
  try {
    if (!S.audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) S.audio = new AC();
    }
    if (S.audio && S.audio.state !== 'running') S.audio.resume().catch(() => {});
  } catch (e) { /* ignore */ }
}
document.addEventListener('pointerdown', initAudio, true);
document.addEventListener('keydown', initAudio, true);

function beep() {
  const ctx = S.audio;
  if (!ctx || ctx.state !== 'running') return;
  [880, 660, 880].forEach((freq, i) => {
    const t = ctx.currentTime + i * 0.2;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.19);
  });
}

/* ---------- auth ---------- */
async function handleAuth(user) {
  cleanup();
  if (!user) { renderLogin(); return; }
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) {
      await signOut(auth);
      renderLogin(`ไม่พบข้อมูลสิทธิ์ของบัญชีนี้ (ตรวจสอบว่ามี collection "users" และเอกสารชื่อ ${user.uid} ใน Firestore)`);
      return;
    }
    const pd = snap.data();
    if (pd.active !== true) {
      await signOut(auth);
      const got = pd.active === undefined ? 'ไม่มี field ชื่อ active' : `active เป็น ${typeof pd.active} ค่า "${pd.active}" — ต้องเป็นชนิด boolean ค่า true`;
      renderLogin(`บัญชีนี้ยังไม่ได้รับสิทธิ์ใช้งาน หรือถูกปิดการใช้งาน (${got}) กรุณาติดต่อผู้ดูแลระบบ`);
      return;
    }
    if (!['admin', 'operator', 'dept'].includes(pd.role)) {
      await signOut(auth);
      renderLogin(`บทบาทของบัญชีไม่ถูกต้อง (role = "${pd.role ?? ''}") ต้องเป็น admin, operator หรือ dept`);
      return;
    }
    S.user = user;
    S.profile = { uid: user.uid, ...snap.data() };
    if (S.profile.role === 'dept' && !S.profile.dept) {
      await signOut(auth);
      renderLogin('บัญชีแผนกนี้ยังไม่ได้ผูกกับแผนก กรุณาติดต่อผู้ดูแลระบบ');
      return;
    }
    S.view = S.profile.role === 'dept' ? 'dept' : 'board';
    initAudio();
    renderShell();
    startListeners();
  } catch (err) {
    console.error(err);
    renderLogin('เข้าสู่ระบบไม่สำเร็จ: ' + (err.message || err));
  }
}

function cleanup() {
  S.unsubs.forEach((u) => u());
  S.caseUnsubs.forEach((u) => u());
  S.unsubs = []; S.caseUnsubs = [];
  S.user = null; S.profile = null; S.cases = []; S.caseA = new Map(); S.caseB = new Map();
  S.depts = []; S.deptMap = {}; S.escKey = '';
  closeDialog();
  document.title = 'DOOCALL';
}

async function doLogin(form) {
  initAudio(); // การกดปุ่มเข้าสู่ระบบ = ปลดล็อกเสียงของเบราว์เซอร์
  const u = form.user.value.trim();
  const p = form.pass.value;
  const box = $('#login-msg');
  if (!u || !p) { box.innerHTML = msgHtml('error', 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return; }
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  box.innerHTML = '';
  try {
    await signInWithEmailAndPassword(auth, toEmail(u), p);
  } catch (err) {
    box.innerHTML = msgHtml('error', thaiErr(err));
    btn.disabled = false;
  }
}

/* ---------- listeners ---------- */
function startListeners() {
  S.unsubs.push(onSnapshot(query(collection(db, 'departments'), orderBy('order')), (snap) => {
    S.depts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.deptMap = Object.fromEntries(S.depts.map((d) => [d.id, d]));
    onDeptsChanged();
  }, showSysError));
  subscribeCases();
}

function subscribeCases() {
  S.caseUnsubs.forEach((u) => u());
  S.caseUnsubs = [];
  S.caseA = new Map(); S.caseB = new Map();
  S.day = dayKey();
  const base = collection(db, 'cases');
  let qOpen, qToday;
  if (S.profile.role === 'dept') {
    const d = S.profile.dept;
    qOpen = query(base, where('deptId', '==', d), where('status', 'in', OPEN));
    qToday = query(base, where('deptId', '==', d), where('day', '==', S.day));
  } else {
    qOpen = query(base, where('status', 'in', OPEN));
    qToday = query(base, where('day', '==', S.day));
  }
  S.caseUnsubs.push(onSnapshot(qOpen, (s) => { S.caseA = toMap(s); mergeCases(); }, showSysError));
  S.caseUnsubs.push(onSnapshot(qToday, (s) => { S.caseB = toMap(s); mergeCases(); }, showSysError));
}

function toMap(snap) {
  const m = new Map();
  snap.docs.forEach((d) => {
    const x = d.data({ serverTimestamps: 'estimate' });
    m.set(d.id, { id: d.id, ...x, createdMs: tms(x.createdAt), ackMs: tms(x.ackAt), closedMs: tms(x.closedAt), callMs: tms(x.firstCallAt) });
  });
  return m;
}

function mergeCases() {
  const m = new Map(S.caseB);
  S.caseA.forEach((v, k) => m.set(k, v));
  S.cases = [...m.values()];
  clearSysError();
  render();
}

function onDeptsChanged() {
  fillDeptSelects();
  if (S.profile && S.profile.role === 'dept') {
    const d = S.deptMap[S.profile.dept];
    const t = $('#dept-title'); if (t) t.textContent = d ? d.name : 'ไม่พบแผนก';
    const s = $('#dept-sub'); if (s) s.textContent = d ? `ต่อ ${d.ext || '-'} · ${d.building || '-'}` : '';
  }
  if (S.view === 'admin') paintAdminDepts();
  render();
}

function showSysError(err) {
  console.error(err);
  const box = $('#sys');
  if (box) box.innerHTML = msgHtml('error', thaiErr(err));
}
function clearSysError() { const box = $('#sys'); if (box) box.innerHTML = ''; }

/* ---------- shared ---------- */
function view(c, now) {
  const created = c.createdMs ?? now;
  const d = S.deptMap[c.deptId] || { name: c.deptName || '-', ext: '-', building: '-' };
  return { ...c, created, d, isEsc: c.status === 'pending' && now - created >= ESCALATE_MIN * 60000 };
}
function escKeyNow(now) {
  return S.cases.filter((c) => c.status === 'pending' && now - (c.createdMs ?? now) >= ESCALATE_MIN * 60000)
    .map((c) => c.id).sort().join(',');
}
function render() {
  if (!S.profile) return;
  S.escKey = escKeyNow(Date.now());
  if (S.view === 'board') renderBoard();
  else if (S.view === 'dept') renderDept();
}

function tick() {
  if (!S.profile) return;
  const now = Date.now();
  const ck = $('#clock'); if (ck) ck.textContent = hms(now);
  document.querySelectorAll('[data-since]').forEach((el) => {
    const t = +el.dataset.since;
    const f = el.dataset.fmt;
    el.textContent = f === 'ago' ? ago(now - t) : f === 'wait' ? longDur(now - t) : f === 'short' ? shortDur(now - t) : dur(now - t);
  });
  if (dayKey() !== S.day) subscribeCases();
  if (escKeyNow(now) !== S.escKey) render();
  paintNet();
  if (S.profile.role === 'dept') {
    paintSound();
    const pend = S.cases.filter((c) => c.status === 'pending');
    const n = pend.length;
    if (SHOW_DOO) {
      const md = n ? dooMoodFor(now - Math.min(...pend.map((c) => c.createdMs ?? now)))
        : (S.cases.some((c) => c.status === 'ack') ? 'happy' : 'sleep');
      if (md !== S.dooMood) renderDept();
    }
    document.title = n ? `(${n}) มีคนไข้รอโทรกลับ` : 'DOOCALL';
    if (n && now - S.lastRing >= RING_EVERY_MS) { S.lastRing = now; beep(); }
  }
}

function paintNet() {
  const el = $('#net'); if (!el) return;
  const on = navigator.onLine;
  const key = on ? 'on' : 'off';
  if (S.netState === key && el.innerHTML) return;
  S.netState = key;
  el.innerHTML = `<span class="dot" style="background:${on ? '#16A34A' : '#F59E0B'}"></span><span>${on ? 'ออนไลน์ · อัปเดตอัตโนมัติ' : 'ออฟไลน์ — ข้อมูลอาจไม่เป็นปัจจุบัน'}</span>`;
}
function paintSound() {
  const el = $('#sound'); if (!el) return;
  const ready = !!(S.audio && S.audio.state === 'running');
  const key = ready ? 'on' : 'off';
  if (S.soundState === key && el.innerHTML) return;
  S.soundState = key;
  el.innerHTML = `<span class="dot" style="background:${ready ? '#22C55E' : '#F59E0B'}"></span><span>${ready ? 'เสียงแจ้งเตือนพร้อม' : 'แตะหน้าจอ 1 ครั้งเพื่อเปิดเสียง'}</span>`;
}

function toast(type, text) {
  const box = $('#toast');
  box.innerHTML = `<div class="toast msg ${type}" role="status">${text}</div>`;
  clearTimeout(S.toastTimer);
  S.toastTimer = setTimeout(() => { box.innerHTML = ''; }, 4500);
}
async function guard(promise, okText) {
  try { await promise; if (okText) toast('ok', okText); return true; }
  catch (err) { console.error(err); toast('error', thaiErr(err)); return false; }
}

function fillDeptSelects() {
  const make = (sel, first, activeOnly) => {
    if (!sel) return;
    const cur = sel.value;
    const list = S.depts.filter((d) => !activeOnly || d.active !== false);
    sel.innerHTML = `<option value="">${first}</option>` + list.map((d) => `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('');
    if (cur && list.some((d) => d.id === cur)) sel.value = cur;
  };
  make($('#f-dept'), '— เลือกแผนก —', true);
  make($('#f-filter'), 'ทุกแผนก', false);
  make($('#u-dept'), '— เลือกแผนก —', true);
  paintDeptInfo();
}

function paintFormChips() {
  document.querySelectorAll('[data-act=topic]').forEach((b) => {
    const on = b.dataset.v === S.form.topic;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
  });
  document.querySelectorAll('[data-act=urgent]').forEach((b) => {
    const isU = b.dataset.v === '1';
    const on = isU === S.form.urgent;
    b.classList.toggle('on-n', on && !isU); b.classList.toggle('on-u', on && isU);
    b.setAttribute('aria-pressed', String(on));
  });
}

function paintDeptInfo() {
  const el = $('#f-dept-info'); const sel = $('#f-dept');
  if (!el || !sel) return;
  const d = S.deptMap[sel.value];
  el.textContent = d ? `เบอร์ภายใน ${d.ext || '-'} · ${d.building || '-'}` : '';
}

async function submitCase(form) {
  const box = $('#form-msg');
  const deptId = form.dept.value;
  const name = form.pname.value.trim();
  const phone = form.phone.value.trim();
  const hn = form.hn.value.trim();
  const note = form.note.value.trim();
  if (!deptId || !name || !phone) { box.innerHTML = msgHtml('error', 'กรุณาเลือกแผนก และกรอกชื่อกับเบอร์โทรคนไข้'); return; }
  if (!/^[0-9+\-\s()]{6,20}$/.test(phone)) { box.innerHTML = msgHtml('error', 'รูปแบบเบอร์โทรไม่ถูกต้อง'); return; }
  const d = S.deptMap[deptId];
  const now = new Date();
  const day = dayKey(now);
  const ref = doc(collection(db, 'cases'));
  const batch = writeBatch(db);
  batch.set(ref, {
    deptId, deptName: d.name, patientName: name, phone, hn, note,
    topic: S.form.topic || 'อื่นๆ', urgent: S.form.urgent,
    status: 'pending', day, attempts: 0, masked: false,
    createdAt: serverTimestamp(), createdByUid: S.user.uid,
    createdByName: S.profile.displayName || S.profile.username || ''
  });
  batch.set(doc(db, 'stats', day), {
    day, total: increment(1),
    hours: { [pad(now.getHours())]: increment(1) },
    depts: { [deptId]: { name: d.name, cases: increment(1) } }
  }, { merge: true });
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; box.innerHTML = '';
  try {
    await batch.commit();
    form.reset();
    S.form = { topic: '', urgent: false };
    paintFormChips(); paintDeptInfo();
    box.innerHTML = msgHtml('ok', `ส่งถึง ${esc(d.name)} แล้ว — หน้าจอแผนกกำลังส่งเสียงเตือน`);
    setTimeout(() => { if (box.querySelector('.ok')) box.innerHTML = ''; }, 5000);
    form.pname.focus();
  } catch (err) {
    box.innerHTML = msgHtml('error', 'บันทึกไม่สำเร็จ: ' + thaiErr(err));
  } finally { btn.disabled = false; }
}

/* ---------- operator: board ---------- */
function renderBoard() {
  const listBox = $('#board-list'); if (!listBox) return;
  const now = Date.now();
  const today = dayKey();
  const all = S.cases.map((c) => view(c, now));
  const inDept = (c) => !S.deptFilter || c.deptId === S.deptFilter;
  const tab = TABS.find((t) => t[0] === S.tab) || TABS[0];
  const rank = (c) => (c.status === 'pending' ? 0 : c.status === 'ack' ? 1 : 2);

  const escList = ['open', 'pending', 'all'].includes(S.tab)
    ? all.filter((c) => c.isEsc && inDept(c)).sort((a, b) => a.created - b.created) : [];
  const list = all.filter((c) => !c.isEsc && inDept(c) && tab[2](c)).sort((a, b) => {
    if (rank(a) !== rank(b)) return rank(a) - rank(b);
    if (rank(a) === 2) return (b.closedMs || 0) - (a.closedMs || 0);
    if (!!a.urgent !== !!b.urgent) return a.urgent ? -1 : 1;
    return a.created - b.created;
  });

  // KPIs
  const pendingN = all.filter((c) => c.status === 'pending').length;
  const escN = all.filter((c) => c.isEsc).length;
  const ackN = all.filter((c) => c.status === 'ack').length;
  const closedToday = all.filter((c) => CLOSED.includes(c.status) && c.status !== 'cancelled' && c.closedMs && dayKey(new Date(c.closedMs)) === today);
  const ackedToday = all.filter((c) => typeof c.ackSeconds === 'number' && c.day === today);
  const avg = ackedToday.length ? ackedToday.reduce((t, c) => t + c.ackSeconds, 0) / ackedToday.length : 0;
  $('#kpis').innerHTML = [
    kpi('รอแผนกรับเรื่อง', pendingN, 'หน้าจอแผนกกำลังส่งเสียงเตือน', pendingN ? 'red' : 'gray', ICON.bell),
    escN
      ? `<div class="kpi alert"><div class="kpi-ic">${ICON.alert}</div><div><div class="l">เกิน ${ESCALATE_MIN} นาที ไม่มีผู้รับเรื่อง</div><div class="v">${escN}</div><div class="s">ต้องโทรตามแผนกโดยตรง</div></div></div>`
      : kpi(`เกิน ${ESCALATE_MIN} นาที ไม่มีผู้รับเรื่อง`, 0, 'ไม่มีเคสค้างนาน', 'gray', ICON.alert),
    kpi('รับเรื่องแล้ว รอโทรกลับ', ackN, 'แผนกกำลังดำเนินการ', 'amber', ICON.clock),
    kpi('ปิดเคสวันนี้', closedToday.length, `รับเรื่องเฉลี่ย ${dur(avg * 1000)} นาที`, 'green', ICON.check)
  ].join('');

  $('#tabs').innerHTML = TABS.map(([id, label, test]) => {
    const on = id === S.tab;
    const n = all.filter((c) => inDept(c) && test(c)).length;
    return `<button type="button" role="tab" class="tab ${on ? 'on' : ''}" aria-selected="${on}" data-act="tab" data-v="${id}">${label}<span class="n">${n}</span></button>`;
  }).join('');

  let html = '';
  if (escList.length) {
    html += `<div class="stack-sm"><div class="esc-head">${ICON.alert} ไม่มีผู้รับเรื่องเกิน ${ESCALATE_MIN} นาที — โทรตามแผนกโดยตรง</div>
      <div class="cards">${escList.map(escCard).join('')}</div></div>`;
  }
  if (list.length) html += `<div class="cards">${list.map(opCard).join('')}</div>`;
  if (!escList.length && !list.length) html = `<div class="empty">ไม่มีเคสในมุมมองนี้</div>`;
  listBox.innerHTML = html;
}

function kpi(label, value, sub, tone = 'blue', icon = ICON.inbox) {
  return `<div class="kpi glass t-${tone}"><div class="kpi-ic">${icon}</div>
    <div style="min-width:0"><div class="l">${label}</div><div class="v">${value}</div><div class="s">${sub}</div></div></div>`;
}

// เส้นเวลาย่อ: ฝาก → รับเรื่อง → ปิดเคส
function timeline(c, now) {
  const cancelled = c.status === 'cancelled';
  const s1 = `<li class="on"><span class="d"></span><b>ฝาก</b><span class="t">${hm(c.created)}</span></li>`;
  let s2;
  if (c.ackMs) s2 = `<li class="on"><span class="d"></span><b>รับเรื่อง</b><span class="t">${hm(c.ackMs)}</span><em>ใช้ ${shortDur((c.ackSeconds || 0) * 1000)}</em></li>`;
  else if (c.status === 'pending') s2 = `<li class="now"><span class="d"></span><b>รับเรื่อง</b><span class="t red">รอ <span data-since="${c.created}" data-fmt="short">${shortDur(now - c.created)}</span></span></li>`;
  else s2 = `<li><span class="d"></span><b>รับเรื่อง</b><span class="t muted">–</span></li>`;
  let sCall;
  if (c.callMs) sCall = `<li class="on"><span class="d"></span><b>โทร</b><span class="t">${hm(c.callMs)}</span><em>ใช้ ${shortDur((c.callSeconds || 0) * 1000)}</em></li>`;
  else if (c.status === 'ack' && c.ackMs) sCall = `<li class="now-a"><span class="d"></span><b>โทร</b><span class="t">รอ <span data-since="${c.ackMs}" data-fmt="short">${shortDur(now - c.ackMs)}</span></span></li>`;
  else sCall = `<li><span class="d"></span><b>โทร</b><span class="t muted">–</span></li>`;
  let s3;
  if (c.closedMs) s3 = `<li class="on"><span class="d"></span><b>${cancelled ? 'ยกเลิก' : 'ปิดเคส'}</b><span class="t">${hm(c.closedMs)}</span></li>`;
  else s3 = `<li><span class="d"></span><b>ปิดเคส</b><span class="t muted">–</span></li>`;
  return `<ol class="tl" aria-label="ความคืบหน้าของเคส">${s1}${s2}${cancelled && !c.ackMs ? '' : sCall}${s3}</ol>`;
}

    <div class="case-b">
      <div class="esc-call"><div><div class="lbl2">โทรตามแผนก</div><div class="ext-big">ต่อ ${esc(c.d.ext)}</div></div>${ICON.phone}</div>
      ${patientBox(c)}
    </div>
    <div class="case-f"><span>ฝาก ${hm(c.created)} · ${esc(shortName(c.createdByName))}</span>

function opCard(c) {
  const open = OPEN.includes(c.status);
  const who = [shortName(c.createdByName), c.ackEmpId ? `ID ${c.ackEmpId}` : ''].filter(Boolean).join(' → ');
  const show = S.expanded.has(c.id);
  return `<article class="case glass s-${esc(c.status)} clickable${show ? ' expanded' : ''}" data-act="toggle-tl" data-id="${esc(c.id)}"
      tabindex="0" title="คลิกเพื่อ${show ? 'ซ่อน' : 'ดู'}รายละเอียดเวลา">
    <div class="case-h"><div style="min-width:0"><div class="dname">${esc(c.d.name)}</div><div class="ext"><span>${ICON.phoneSm}${esc(c.d.ext)}</span><span>· ${esc(c.d.building)}</span></div></div>
      <div class="corner"><span class="pill st-${esc(c.status)}">${SHORT[c.status] || esc(c.status)}</span>
        ${open ? `<button type="button" class="trash" data-act="cancel" data-id="${esc(c.id)}" aria-label="ยกเลิกเคสนี้ (ฝากผิดแผนกหรือซ้ำ)" title="ยกเลิกเคส">${ICON.trash}</button>` : ''}</div></div>
    <div class="case-b">
      ${patientBox(c)}

    if (!!a.urgent !== !!b.urgent) return a.urgent ? -1 : 1;
    return a.created - b.created;
  });
  const closed = all.filter((c) => CLOSED.includes(c.status)).sort((a, b) => (b.closedMs || 0) - (a.closedMs || 0));

  const oldest = pending.length ? Math.min(...pending.map((c) => c.created)) : now;

/* ---------- case actions ---------- */
async function ackCase(id, empId) {
  const ref = doc(db, 'cases', id);
  return runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    if (!snap.exists()) return false;
    const c = snap.data();
    if (c.status !== 'pending') return false; // มีคนรับเรื่องไปแล้ว
    const created = tms(c.createdAt) || Date.now();
    const sec = Math.max(0, Math.round((Date.now() - created) / 1000));
    tx.update(ref, { status: 'ack', ackAt: serverTimestamp(), ackEmpId: empId, ackByUid: S.user.uid, ackSeconds: sec });
    tx.set(doc(db, 'stats', c.day), {
      depts: { [c.deptId]: { ackCount: increment(1), ackSum: increment(sec), late: increment(sec > ESCALATE_MIN * 60 ? 1 : 0) } }
    }, { merge: true });
    return true;
  });
}

async function closeCase(id, status) {
  const ref = doc(db, 'cases', id);
  return runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    if (!snap.exists()) return false;
    const c = snap.data();
    const allowedFrom = status === 'cancelled' ? OPEN : ['ack'];
    if (!allowedFrom.includes(c.status)) return false;
    const upd = {
      status, closedAt: serverTimestamp(), closedByUid: S.user.uid,
      closedByName: S.profile.role === 'dept' ? 'แผนก' : (S.profile.displayName || S.profile.username || '')
    };
    const st = { [status]: increment(1) };
    const ackMs = tms(c.ackAt);
    if (status !== 'cancelled' && ackMs) {
      // เวลาตั้งแต่รับเรื่องจนปิดเคส
      const resolveSec = Math.max(0, Math.round((Date.now() - ackMs) / 1000));
      upd.resolveSeconds = resolveSec;
      st.resolveCount = increment(1); st.resolveSum = increment(resolveSec);
      // ถ้ายังไม่เคยบันทึกเวลาโทร ใช้เวลาที่กดปุ่มนี้เป็นเวลาโทรครั้งแรก
      if (!c.firstCallAt) {
        upd.firstCallAt = serverTimestamp(); upd.callSeconds = resolveSec;
        st.callCount = increment(1); st.callSum = increment(resolveSec);
      }
    }
    tx.update(ref, upd);
    tx.set(doc(db, 'stats', c.day), { depts: { [c.deptId]: st } }, { merge: true });
    return true;
  });
}

async function recordAttempt(id) {
  const ref = doc(db, 'cases', id);
  return runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    if (!snap.exists()) return false;
    const c = snap.data();
    if (c.status !== 'ack') return false;
    const upd = { attempts: increment(1), lastAttemptAt: serverTimestamp() };
    const ackMs = tms(c.ackAt);
    if (!c.firstCallAt && ackMs) {
      const callSec = Math.max(0, Math.round((Date.now() - ackMs) / 1000));
      upd.firstCallAt = serverTimestamp(); upd.callSeconds = callSec;
      tx.set(doc(db, 'stats', c.day), { depts: { [c.deptId]: { callCount: increment(1), callSum: increment(callSec) } } }, { merge: true });
    }
    tx.update(ref, upd);
    return true;
  });
}

function renderStats(docs) {
  const body = $('#stats-body'); if (!body) return;
  const KEYS = ['cases', 'ackCount', 'ackSum', 'late', 'done', 'fail', 'wrong', 'cancelled', 'callCount', 'callSum', 'resolveCount', 'resolveSum'];
  const depts = {};
  const hours = Array(24).fill(0);
  docs.forEach((s) => {
    Object.entries(s.hours || {}).forEach(([h, n]) => { const i = +h; if (i >= 0 && i < 24) hours[i] += n || 0; });
    Object.entries(s.depts || {}).forEach(([id, v]) => {
      const t = depts[id] || (depts[id] = { id, name: '', cases: 0, ackCount: 0, ackSum: 0, late: 0, done: 0, fail: 0, wrong: 0, cancelled: 0, callCount: 0, callSum: 0, resolveCount: 0, resolveSum: 0 });
      KEYS.forEach((k) => { t[k] += v[k] || 0; });
      t.name = (S.deptMap[id] && S.deptMap[id].name) || v.name || t.name || id;
    });
  });
  const rows = Object.values(depts).map((r) => ({ ...r, real: Math.max(0, r.cases - r.cancelled) }))
    .filter((r) => r.real > 0).sort((a, b) => b.real - a.real);
  const sum = (k) => rows.reduce((t, r) => t + r[k], 0);
  const total = sum('real');
  if (!total) { body.innerHTML = `<div class="empty">ยังไม่มีข้อมูลในช่วงเวลานี้</div>`; return; }
  const ackCount = sum('ackCount'), ackSum = sum('ackSum'), late = sum('late');
  const callCount = sum('callCount'), callSum = sum('callSum');
  const done = sum('done'), fail = sum('fail'), wrong = sum('wrong');
  const closedN = done + fail + wrong;
  const openN = Math.max(0, total - closedN);
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const max = Math.max(...rows.map((r) => r.real));
  const hMax = Math.max(1, ...hours);

  body.innerHTML = `
  <div class="kpis kpis5">
    ${kpi('เคสติดต่อกลับทั้งหมด', total, 'ไม่รวมเคสที่ Operator ยกเลิก', 'blue', ICON.inbox)}
    ${kpi('เวลารับเรื่องเฉลี่ย', dur(ackCount ? (ackSum / ackCount) * 1000 : 0), 'นาที ตั้งแต่ Operator ฝากเคส', 'amber', ICON.clock)}
    ${kpi('รับเรื่อง → โทร เฉลี่ย', dur(callCount ? (callSum / callCount) * 1000 : 0), `นาที · จาก ${callCount} เคส`, 'blue', ICON.phone)}
    ${kpi(`รับเรื่องช้ากว่า ${ESCALATE_MIN} นาที`, late, `${pct(late, ackCount)}% ของเคสที่รับเรื่องแล้ว`, 'red', ICON.alert)}
    ${kpi('โทรกลับสำเร็จ', pct(done, closedN) + '%', `${done} จาก ${closedN} เคสที่ปิดแล้ว`, 'green', ICON.check)}
  </div>
  <div class="st-grid">
    <section class="glass card stack-sm">
      <div><h2 class="h2" style="font-size:18px">เคสติดต่อกลับแยกตามแผนก</h2><p class="sub">เรียงจากจำนวนเคสมากไปน้อย</p></div>
      <div class="trow head"><div>แผนก</div><div class="hide-sm"></div><div class="r">เคส</div><div class="r hide-sm">รับเรื่องเฉลี่ย</div><div class="r hide-sm">รับเรื่อง→โทร</div><div class="r hide-sm">ช้ากว่า ${ESCALATE_MIN} น.</div><div class="r hide-sm">สำเร็จ</div></div>
      ${rows.map((r, i) => {
        const avg = r.ackCount ? r.ackSum / r.ackCount : 0;
        const avgCall = r.callCount ? r.callSum / r.callCount : null;
        const closed = r.done + r.fail + r.wrong;
        return `<div class="trow"><div class="nm" title="${esc(r.name)}">${esc(r.name)}</div>
          <div class="bar hide-sm"><div style="width:${Math.round((r.real / max) * 100)}%;background:${i < 3 ? 'var(--blue)' : '#9DBDF0'}"></div></div>
          <div class="r mono" style="font-weight:600">${r.real}</div>
          <div class="r mono hide-sm" style="color:${avg > ESCALATE_MIN * 60 ? 'var(--red)' : 'inherit'}">${dur(avg * 1000)}</div>
          <div class="r mono hide-sm" style="color:${avgCall > 600 ? 'var(--red)' : 'inherit'}">${avgCall === null ? '-' : dur(avgCall * 1000)}</div>
          <div class="r mono hide-sm" style="color:${r.late ? 'var(--red)' : 'var(--muted)'}">${r.late}</div>
          <div class="r mono hide-sm">${closed ? pct(r.done, closed) + '%' : '-'}</div></div>`;
      }).join('')}
    </section>
    <div class="stack" style="gap:24px">
      <section class="glass card stack-sm">
        <div><h2 class="h2" style="font-size:18px">ช่วงเวลาที่ Operator ต้องฝากเคส</h2><p class="sub">แท่งสีเข้ม คือช่วงที่ควรเพิ่มคนรับสายที่แผนก</p></div>
        <div class="hours">${hours.map((n) => `<div class="hcol"><div class="hn">${n || ''}</div>
          <div class="hbar ${n >= hMax * 0.75 && n > 0 ? 'hi' : ''}" style="height:${n ? Math.max(4, Math.round((n / hMax) * 140)) : 2}px"></div></div>`).join('')}</div>
        <div class="hlabels">${hours.map((_, h) => `<div class="hl">${h % 2 === 0 ? pad(h) : ''}</div>`).join('')}</div>
      </section>
      <section class="glass card stack-sm">
        <h2 class="h2" style="font-size:18px">ผลการโทรกลับ</h2>
        <div class="stackbar">${[[done, 'var(--green)'], [fail, '#E8A33D'], [wrong, '#8C99A6'], [openN, '#C7D7F0']]
          .map(([n, c]) => (n ? `<div style="width:${(n / total) * 100}%;background:${c}"></div>` : '')).join('')}</div>

async function loadStaff(btn) {
  const box = $('#staff-body'); if (!box) return;
  const { start, end, label } = statsRange();
  btn.disabled = true; box.innerHTML = '<div class="sub">กำลังโหลด…</div>';
  try {
    const snap = await getDocs(query(collection(db, 'cases'), where('day', '>=', start), where('day', '<=', end)));
    const g = {};
    snap.docs.forEach((d) => {
      const c = d.data();
      if (!c.ackEmpId) return;
      const k = `${c.deptId}|${c.ackEmpId}`;
      const r = g[k] || (g[k] = { dept: (S.deptMap[c.deptId] && S.deptMap[c.deptId].name) || c.deptName || '-', emp: c.ackEmpId,
        n: 0, ackSum: 0, ackN: 0, callSum: 0, callN: 0, done: 0, fail: 0, open: 0, last: 0 });
      r.n += 1;
      if (typeof c.ackSeconds === 'number') { r.ackSum += c.ackSeconds; r.ackN += 1; }
      if (typeof c.callSeconds === 'number') { r.callSum += c.callSeconds; r.callN += 1; }
      if (c.status === 'done') r.done += 1;
      else if (c.status === 'fail' || c.status === 'wrong') r.fail += 1;
      else if (c.status === 'ack') r.open += 1;
      r.last = Math.max(r.last, tms(c.ackAt) || 0);
    });
    S.staffRows = Object.values(g).sort((a, b) => a.dept.localeCompare(b.dept, 'th') || b.n - a.n);
    if (!S.staffRows.length) { box.innerHTML = '<div class="empty">ยังไม่มีข้อมูลการรับเรื่องในช่วงเวลานี้</div>'; return; }
    const avg = (sum, n) => (n ? shortDur((sum / n) * 1000) : '-');
    const R = 'style="text-align:right"';
    box.innerHTML = `
      <div class="row-w" style="justify-content:space-between"><span class="sub">${S.staffRows.length} รายการ · ${esc(label)}</span>
        <button type="button" class="btn btn-light sm" data-act="staff-export">${ICON.download} ดาวน์โหลด Excel</button></div>

          <th ${R}>รับเรื่อง→โทร</th><th ${R}>ติดต่อแล้ว</th><th ${R}>ติดต่อไม่ได้/เบอร์ผิด</th><th ${R}>ยังค้าง</th><th>รับเรื่องล่าสุด</th></tr></thead>
        <tbody>${S.staffRows.map((r) => `<tr>
          <td>${esc(r.dept)}</td><td style="font-weight:600">${esc(r.emp)}</td><td ${R}><b>${r.n}</b></td>
          <td ${R}>${avg(r.ackSum, r.ackN)}</td><td ${R}>${avg(r.callSum, r.callN)}</td>
          <td ${R}>${r.done}</td><td ${R}>${r.fail}</td>
          <td style="text-align:right;${r.open ? 'color:var(--amber);font-weight:600' : ''}">${r.open}</td>
          <td class="muted">${r.last ? `${new Date(r.last).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })} ${hm(r.last)}` : '-'}</td></tr>`).join('')}</tbody>
      </table></div>`;
  } catch (err) { box.innerHTML = msgHtml('error', thaiErr(err)); }
  finally { btn.disabled = false; }
}

function downloadCSV(lines, filename) {
  const cell = (v) => {
    let x = String(v ?? '');
    if (/^[=+@]/.test(x)) x = "'" + x; // กันสูตรใน Excel
    return `"${x.replace(/"/g, '""')}"`;
  };
  const csv = '﻿' + lines.map((r) => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function exportCSV(btn) {
  const { start, end } = statsRange();
  btn.disabled = true;
  try {
    const snap = await getDocs(query(collection(db, 'cases'), where('day', '>=', start), where('day', '<=', end)));
    const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (tms(a.createdAt) || 0) - (tms(b.createdAt) || 0));
    const fmt = (t) => { const ms = tms(t); return ms ? hms(ms) : ''; };
    const mins = (sec) => (typeof sec === 'number' ? (sec / 60).toFixed(1) : '');
    const header = ['วันที่', 'เวลาฝาก', 'แผนก', 'ชื่อคนไข้', 'เบอร์โทร', 'HN', 'เรื่อง', 'รายละเอียด', 'ด่วน', 'สถานะ', 'Operator',

    const lines = [header].concat(rows.map((c) => [
      c.day, fmt(c.createdAt), (S.deptMap[c.deptId] && S.deptMap[c.deptId].name) || c.deptName, c.patientName, c.phone, c.hn,
      c.topic, c.note, c.urgent ? 'ด่วน' : '', STATUS[c.status] || c.status, c.createdByName,
      fmt(c.ackAt), c.ackEmpId || '', mins(c.ackSeconds),
      fmt(c.firstCallAt), mins(c.callSeconds),
      c.attempts || 0, fmt(c.closedAt), mins(c.resolveSeconds)
    ]));
    const cell = (v) => {
      let s = String(v ?? '');
      if (/^[=+@]/.test(s)) s = "'" + s; // กันสูตรใน Excel
      return `"${s.replace(/"/g, '""')}"`;
    };
    const csv = '﻿' + lines.map((r) => r.map(cell).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `callback_${start}_${end}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('ok', `ดาวน์โหลดแล้ว ${rows.length} เคส`);
  } catch (err) { toast('error', thaiErr(err)); }
  finally { btn.disabled = false; }
}

async function maskOld(btn) {
  if (!confirm(`ปิดบังข้อมูลคนไข้ของเคสที่เก่ากว่า ${MASK_AFTER_DAYS} วัน? ทำย้อนกลับไม่ได้`)) return;
  const box = $('#mask-msg');
  const cutoff = dayOffset(-MASK_AFTER_DAYS);
  btn.disabled = true; box.innerHTML = msgHtml('info', 'กำลังดำเนินการ…');
  const maskName = (n) => { const s = String(n || ''); return s ? s.slice(0, 2) + '***' : ''; };
  const maskPhone = (p) => { const d = String(p || '').replace(/\D/g, ''); return d ? '***-***-' + d.slice(-2) : ''; };
  try {
    let total = 0;
    for (;;) {
      const snap = await getDocs(query(collection(db, 'cases'), where('masked', '==', false), where('day', '<', cutoff), limit(400)));
      if (snap.empty) break;
      const batch = writeBatch(db);
      snap.docs.forEach((d) => {
        const c = d.data();
        batch.update(d.ref, { patientName: maskName(c.patientName), phone: maskPhone(c.phone), hn: '', note: '', masked: true });
      });
      await batch.commit();
      total += snap.size;
    }
    box.innerHTML = msgHtml('ok', total ? `ปิดบังข้อมูลแล้ว ${total} เคส` : 'ไม่มีเคสที่ต้องปิดบัง');
  } catch (err) { box.innerHTML = msgHtml('error', thaiErr(err)); }
  finally { btn.disabled = false; }
}

    case 'topic': S.form.topic = S.form.topic === el.dataset.v ? '' : el.dataset.v; paintFormChips(); break;
    case 'urgent': S.form.urgent = el.dataset.v === '1'; paintFormChips(); break;
    case 'tab': S.tab = el.dataset.v; renderBoard(); break;
    case 'cancel':
      if (confirm('ยกเลิกเคสนี้? (ใช้เมื่อฝากผิดแผนกหรือฝากซ้ำ)')) {
        await guard(closeCase(id, 'cancelled'), 'ยกเลิกเคสแล้ว');
      }
      break;
    case 'ack': openAck(id); break;
    case 'ack-all': openAck('all'); break;
    case 'retry': await guard(recordAttempt(id), 'บันทึกว่าโทรไม่ติดแล้ว'); break;
    case 'done': el.disabled = true; await guard(closeCase(id, 'done'), 'ปิดเคส: โทรกลับสำเร็จ'); break;
    case 'fail': if (confirm('ปิดเคสนี้เป็น "ติดต่อคนไข้ไม่ได้"?')) await guard(closeCase(id, 'fail'), 'ปิดเคสแล้ว'); break;
    case 'wrong': if (confirm('ปิดเคสนี้เป็น "เบอร์ไม่ถูกต้อง"?')) await guard(closeCase(id, 'wrong'), 'ปิดเคสแล้ว'); break;
    case 'toggle-closed': S.showClosed = !S.showClosed; renderDept(); break;
    case 'toggle-tl': if (S.expanded.has(id)) S.expanded.delete(id); else S.expanded.add(id); renderBoard(); break;
    case 'staff-load': await loadStaff(el); break;
    case 'staff-export': exportStaff(); break;
    case 'range': S.statsRange = el.dataset.v; loadStats(); break;
    case 'export': await exportCSV(el); break;
    case 'seed-depts': await seedDepts(el); break;
    case 'edit-dept': fillDeptForm(id); break;
    case 'dept-reset': resetDeptForm(); break;
    case 'toggle-dept': {
      const d = S.deptMap[id];
      if (d) await guard(updateDoc(doc(db, 'departments', id), { active: d.active === false }));
      break;
    }
    case 'toggle-user':
      if (await guard(updateDoc(doc(db, 'users', id), { active: el.dataset.on !== '1' }), 'บันทึกแล้ว')) loadUsers();
      break;
    case 'mask-old': await maskOld(el); break;
    default: break;
  }
});

document.addEventListener('submit', (e) => {
  const f = e.target;
  const handlers = {
    'login-form': doLogin, 'case-form': submitCase, 'ack-form': submitAck, 'pw-form': submitPw,
    'dept-form': submitDept, 'user-form': submitUser,
    'range-form': (form) => {
      const from = form.from.value, to = form.to.value;
      if (!from || !to || from > to) { toast('error', 'ช่วงวันที่ไม่ถูกต้อง'); return; }
      S.statsRange = 'custom'; S.statsFrom = from; S.statsTo = to; loadStats();
    }
  };
  if (handlers[f.id]) { e.preventDefault(); handlers[f.id](f); }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'f-dept') paintDeptInfo();
  if (e.target.id === 'f-filter') { S.deptFilter = e.target.value; renderBoard(); }
  if (e.target.id === 'u-role') toggleUserDept();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.dialog) closeDialog();
  const card = e.target.closest && e.target.closest('.case.clickable');
  if (card && e.target === card && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    const id = card.dataset.id;
    if (S.expanded.has(id)) S.expanded.delete(id); else S.expanded.add(id);
    renderBoard();
    const again = document.querySelector(`.case.clickable[data-id="${CSS.escape(id)}"]`);
    if (again) again.focus();
  }
});
window.addEventListener('online', paintNet);
window.addEventListener('offline', paintNet);
</script>
</body>
